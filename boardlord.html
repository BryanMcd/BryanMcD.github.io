<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garage Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --ground:#EDE6D7; --panel:#FCFAF5; --sunk:#E3DACA; --line:#D3C9B3;
  --ink:#1B1810; --muted:#7A7161; --hair:#C6BAA0;
  --start:#16A34A; --hand:#2563EB; --foot:#D97706; --finish:#9333EA;
  --glow:0 0 0 2px rgba(0,0,0,.30);
  --ring:rgba(0,0,0,.34);
  --yes:#0891B2;  --no:#EA4E1B;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131109; --panel:#1E1B12; --sunk:#171409; --line:#332E20;
  --ink:#F1ECE0; --muted:#9C927E; --hair:#4A422F;
  --start:#4ADE80; --hand:#5B9DF9; --foot:#F5A524; --finish:#C77DFF;
  --glow:0 0 0 2px rgba(0,0,0,.55);
  --ring:rgba(255,255,255,.40);
  --yes:#22D3EE;  --no:#FF5A36;
}}
:root[data-theme="dark"]{
  --ground:#131109; --panel:#1E1B12; --sunk:#171409; --line:#332E20;
  --ink:#F1ECE0; --muted:#9C927E; --hair:#4A422F;
  --start:#4ADE80; --hand:#5B9DF9; --foot:#F5A524; --finish:#C77DFF;
  --glow:0 0 0 2px rgba(0,0,0,.55);
  --ring:rgba(255,255,255,.40);
  --yes:#22D3EE;  --no:#FF5A36;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);
  font:400 15px/1.55 Archivo,ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;
  letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
.mark{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.mark h1{font-size:18px;line-height:1.1}
.mark span{font-size:11.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.btn{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;
  font-weight:500;background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.go{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.btn.go:hover{opacity:.86}
.btn[disabled]{opacity:.4;cursor:not-allowed}

main{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;gap:16px;
  padding:16px;max-width:1500px;margin:0 auto;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chd{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
.chd h2{font-family:Archivo;font-weight:600;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}
.chd .n{margin-left:auto;font-size:11.5px;color:var(--muted)}
.cbd{padding:14px}

/* ---------- board ---------- */
.stage{position:relative;background:var(--sunk);border-radius:var(--r);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  /* keep the whole board on screen: cap by height, let width follow the aspect */
  max-width:min(100%, calc((100vh - 250px) * var(--ar)));margin-inline:auto}
.pan{position:relative;width:100%;transform-origin:0 0;will-change:transform}
.pan img,.pan svg.art{display:block;width:100%;height:auto;pointer-events:none;
  transition:filter .25s ease}
.pan svg.art{position:absolute;inset:0}
/* the drawing sits on the photo and cross-fades with it; its background rect is
   opaque, so opacity 1 is pure drawing and 0 is pure photo */
.pan svg.art{opacity:var(--mix,1)}
.stage.lit .pan img{filter:brightness(.42) saturate(.45) contrast(1.05)}
/* dim the board and the unused holds separately, so the route reads as lit */
.stage.lit svg.art #bg{filter:brightness(.30) saturate(.5)}
svg.art g[data-k]{transition:opacity .2s}
svg.art g[data-k] .hl{stroke:none}
.stage.lit svg.art g[data-k]{opacity:.20}
.stage.lit svg.art g[data-k].on{opacity:1;
  filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 0 14px currentColor)}
svg.art g.on .hl{stroke:currentColor}
svg.art g.start {color:var(--start)}
svg.art g.hand  {color:var(--hand)}
svg.art g.foot  {color:var(--foot)}
svg.art g.finish{color:var(--finish)}
.dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:transparent;padding:0;border:0}
.dot i{display:block;width:100%;height:100%;border-radius:50%;position:relative;
  border:2px solid transparent;box-sizing:border-box}
.dot.avail i{border-color:var(--ring);background:rgba(0,0,0,.14)}
.dot.set i{border-width:3.5px;box-shadow:var(--glow),0 0 12px 3px currentColor;
  background:rgba(0,0,0,.18)}
.dot.start{color:var(--start)} .dot.start.set i{border-color:var(--start)}
.dot.hand {color:var(--hand)}  .dot.hand.set  i{border-color:var(--hand)}
.dot.foot {color:var(--foot)}  .dot.foot.set  i{border-color:var(--foot)}
.dot.finish{color:var(--finish)} .dot.finish.set i{border-color:var(--finish)}
.dot.cal i{border-color:var(--ring);background:rgba(0,0,0,.12)}
.dot.cal.miss i{border-color:rgba(220,80,80,.55);border-style:dashed}
/* Two cues, not one: hue AND lightness differ, so the pair stays readable
   even where colour does not. Cyan+centre pip = I think a hold is here;
   red-orange dashed ring, empty = I think it is bare. */
.dot.cal.unsure i{border-width:3px;border-style:solid}
.dot.cal.unsure.has i{border-color:var(--yes);background:rgba(34,211,238,.30);
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 11px 2px var(--yes)}
.dot.cal.unsure.has i::after{content:"";position:absolute;left:50%;top:50%;
  width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--yes);box-shadow:0 0 4px 1px rgba(0,0,0,.85)}
.dot.cal.unsure.miss i{border-color:var(--no);border-style:dashed;background:transparent;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 11px 2px var(--no)}
.dot.cal.off i{opacity:.07;box-shadow:none;border-width:1.5px}
.dot.cal.seen i{opacity:.30;box-shadow:none;border-width:2px}
.mixbar{display:flex;align-items:center;gap:10px;padding:10px 13px 2px;
  font-size:11.5px;color:var(--muted)}
.mixbar input{flex:1;accent-color:var(--ink);width:auto;background:none;border:0;padding:0}
.boardbar{display:flex;align-items:center;gap:8px;padding:10px 13px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.boardbar .sp{margin-left:auto;display:flex;gap:6px}
.zoom{border:1px solid var(--line);border-radius:7px;width:28px;height:28px;
  display:grid;place-items:center;font-size:15px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 13px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:50%;border:2.5px solid currentColor}
.legend i.f{background:currentColor}
.legend i.d{border-style:dashed}

/* ---------- routes ---------- */
.filters{display:flex;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical}
.list{max-height:min(56vh,540px);overflow:auto;padding:5px}
.rt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid transparent;border-radius:9px;padding:8px 10px}
.rt:hover{background:var(--sunk)}
.rt.sel{background:var(--sunk);border-color:var(--muted)}
.rt .nm{flex:1;min-width:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;
  font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .gr{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;font-size:13px}
.rt .gr.no{color:var(--muted);font-weight:600}
.tagm{font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- panel ---------- */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts{display:flex;gap:8px;margin-top:13px}
.acts>*{flex:1}
.stat{display:flex;gap:16px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:17px;font-weight:800}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:12.5px;margin:5px 0 11px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warn{font-size:12.5px;color:var(--foot);margin-top:10px;line-height:1.45}
.danger{color:#DC2626;border-color:rgba(220,38,38,.4)}
.grade-big{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;font-size:15px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:999px;
  font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tabs{display:none;gap:6px;padding:10px 16px 0}
.tabs button{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px;
  font-size:13px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

@media(max-width:1040px){
  .stage{max-width:100%}
  main{grid-template-columns:1fr;max-width:620px;padding:12px;gap:12px}
  main>.card:not(.pane){order:-1}          /* board first at the wall */
  .tabs{display:flex}
  main>.card.pane{display:none}
  main>.card.pane.show{display:block}
  .list{max-height:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="mark"><h1 id="bname">Garage Board</h1><span id="bsub"></span></div>

  <button class="btn" id="themeBtn" title="Light / dark">Theme</button>
  <button class="btn go" id="newBtn">Set a route</button>
</header>

<div class="tabs">
  <button data-pane="routes" class="on">Routes</button>
  <button data-pane="side">Details</button>
</div>

const ROLES={start:1,hand:2,foot:3,finish:4};
const ORDER=["start","hand","foot","finish"];
const CAP={start:2,finish:1};

const K_ROUTES="garageboard.routes.v1", K_HOLDS="garageboard.holds.v1",
      K_THEME="garageboard.theme", K_VIEW="garageboard.photo";
const key=h=>h.c+"-"+h.r;
const BY={}; HOLDS.forEach(h=>BY[key(h)]=h);

const BAND=2;        // rows reviewed per step - keeps the photo readable
const K_BANDS="garageboard.bands.v1";

/* ---------- storage (all guarded: artifacts can run without storage) ---------- */
function load(k,f){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):f}catch(e){return f} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
function saveRoutes(){ save(K_ROUTES, S.routes.filter(r=>!r.starter)) }
function saveHolds(){
  const diff={}; HOLDS.forEach(h=>{ if(S.on[key(h)]!==h.on) diff[key(h)]=S.on[key(h)] });
  save(K_HOLDS,diff);
}

/* ---------- board ---------- */
const stage=document.getElementById("stage"), pan=document.getElementById("pan");
function activeRoute(){ return S.mode==="set"?S.draft:S.sel }
function roles(){ const a=activeRoute(); return a?a.holds:null }

const artEl=document.getElementById("art");
function buildBoard(){
  const cell=100/BOARD.cols;                       // one grid cell as % of width
  for(const h of HOLDS){
    const b=document.createElement("button");
    b.className="dot"; b.dataset.k=key(h); b.type="button";
    b.style.left=h.x+"%"; b.style.top=h.y+"%";
    b.style.width=(cell*0.80)+"%"; b.style.aspectRatio="1";
    b.appendChild(document.createElement("i"));
    pan.appendChild(b);
  }
  paint();
}
function paint(){
  const r=roles(), edit=S.mode!=="view";
  stage.classList.toggle("lit", !!r && Object.keys(r).length>0 && S.mode!=="cal");
  for(const el of pan.querySelectorAll(".dot")){
    const k=el.dataset.k, role=r?r[k]:null, exists=S.on[k];
    if(S.mode==="cal"){
      const h=BY[k], lo=S.band*BAND, inBand=h&&h.r>=lo&&h.r<lo+BAND;
      el.className="dot cal "+(exists?"has":"miss")
        +(inBand?" unsure":(h&&h.v?" seen":" off"));
    }else{
      el.className="dot"+(role&&edit?" set "+role:"")+(!role&&edit&&exists?" avail":"");
    }
    el.disabled = S.mode==="view" || (S.mode==="set"&&!exists);
    el.setAttribute("aria-label", k+(role?" \u2013 "+role:""));
  }
  // tint the actual hold silhouettes for the active route; calibrating is about
  // the holds themselves, so no route colouring there
  for(const g of artEl.querySelectorAll("g[data-k]")){
    const role=(r&&S.mode!=="cal")?r[g.dataset.k]:null;
    g.setAttribute("class", role?("on "+role):"");
  }
  const a=activeRoute();
  document.getElementById("angle").textContent=((a&&a.angle)||BOARD.angle)+"\u00b0";
  document.getElementById("bnote").textContent =
    S.mode==="cal" ? "Tap any position to add or remove a hold"
    : S.mode==="set" ? "Tap a hold: start \u2192 hand \u2192 foot \u2192 finish \u2192 off"
    : a ? a.name : "Pick a route";
  document.getElementById("mode").textContent =
    S.mode==="cal"?"Calibrating":S.mode==="set"?"Setting":"Board";
  document.getElementById("legend").innerHTML = S.mode==="cal"
    ? '<span><i class="f" style="color:var(--yes)"></i>I think: hold here</span>'
      +'<span><i class="d" style="color:var(--no)"></i>I think: nothing here</span>'
      +'<span style="opacity:.7">Tap whichever I got wrong</span>'
    : '<span><i style="color:var(--start)"></i>Start</span>'
      +'<span><i style="color:var(--hand)"></i>Hand</span>'
      +'<span><i style="color:var(--foot)"></i>Foot only</span>'
      +'<span><i style="color:var(--finish)"></i>Finish</span>';
}
pan.addEventListener("click",e=>{
  const b=e.target.closest(".dot"); if(!b||moved) return;
  const k=b.dataset.k;
  if(S.mode==="cal"){ S.on[k]=!S.on[k]; saveHolds(); paint(); renderCal(); return }
  if(S.mode==="set"){ cycle(k); }
});
function cycle(k){
  const H=S.draft.holds, cur=H[k];
  // a fresh tap starts at "start", but once both starts are taken it begins at
  // "hand" -- otherwise adding a hand would silently knock a start off the route
  const full=n=>Object.keys(H).filter(x=>H[x]===n&&x!==k).length>=CAP[n];
  const nx = cur==null ? (full("start")?"hand":"start") : ORDER[ORDER.indexOf(cur)+1] || null;
  if(nx==null){ delete H[k] }
  else{
    const cap=CAP[nx];
    if(cap){
      const same=Object.keys(H).filter(x=>H[x]===nx&&x!==k);
      while(same.length>=cap) delete H[same.shift()];
    }
    H[k]=nx;
  }
  paint(); renderSide();
}

/* ---------- pan + zoom ---------- */
function applyT(){ pan.style.transform=`translate(${S.tx}px,${S.ty}px) scale(${S.z})` }
function clamp(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const mx=w*(S.z-1), my=h*(S.z-1);
  S.tx=Math.min(0,Math.max(-mx,S.tx)); S.ty=Math.min(0,Math.max(-my,S.ty));
}
function zoomAt(f,cx,cy){
  const z2=Math.min(4,Math.max(1,S.z*f));
  const r=stage.getBoundingClientRect();
  const px=(cx-r.left-S.tx)/S.z, py=(cy-r.top-S.ty)/S.z;
  S.tx=cx-r.left-px*z2; S.ty=cy-r.top-py*z2; S.z=z2;
  if(S.z===1){S.tx=0;S.ty=0}
  clamp(); applyT();
}
let ptr=new Map(), last=null, moved=false, pinch0=0;
stage.addEventListener("pointerdown",e=>{
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if(ptr.size===1){ last={x:e.clientX,y:e.clientY}; }
  if(ptr.size===2){ const p=[...ptr.values()]; pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y) }
});
stage.addEventListener("pointermove",e=>{
  if(!ptr.has(e.pointerId)) return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=[...ptr.values()];
  if(p.length===2){
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinch0>0){ zoomAt(d/pinch0,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2); pinch0=d }
    moved=true; e.preventDefault(); return;
  }
  if(p.length===1&&last&&S.z>1){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    S.tx+=dx; S.ty+=dy; last={x:e.clientX,y:e.clientY}; clamp(); applyT();
  }
});
function up(e){ ptr.delete(e.pointerId); if(ptr.size<2)pinch0=0; if(!ptr.size)last=null }
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",e=>{ if(!e.ctrlKey&&Math.abs(e.deltaY)<2)return;
  e.preventDefault(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY) },{passive:false});
document.getElementById("zin").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.4,r.left+r.width/2,r.top+r.height/2)};
document.getElementById("zout").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1/1.4,r.left+r.width/2,r.top+r.height/2)};
document.getElementById("zfit").onclick=()=>{S.z=1;S.tx=0;S.ty=0;applyT()};

/* ---------- list ---------- */
const listEl=document.getElementById("list");
function shown(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const g=document.getElementById("gf").value;
  return S.routes.filter(r=>
    (g===""||(g==="~"?!r.grade:r.grade===g)) &&
    (!q||r.name.toLowerCase().includes(q)||(r.setter||"").toLowerCase().includes(q)));
}
function render(){
  const rs=shown();
  document.getElementById("rcount").textContent=rs.length+" / "+S.routes.length;
  listEl.innerHTML = rs.length? rs.map(r=>
    `<button class="rt${S.sel&&S.sel.id===r.id?" sel":""}" data-id="${r.id}">
       <span class="nm">${esc(r.name)}</span>
       ${r.starter?'<span class="tagm">AUTO</span>':""}
       <span class="gr tnum${r.grade?"":" no"}">${r.grade||"\u2014"}</span>
     </button>`).join("") : '<div class="empty">Nothing matches.</div>';
}
listEl.onclick=e=>{
  const b=e.target.closest(".rt"); if(!b) return;
  S.sel=S.routes.find(r=>r.id===b.dataset.id); S.mode="view"; S.draft=null;
  render(); paint(); renderSide(); showPane("side");
};

      <div><b class="tnum">${c.start}</b><span>Start</span></div>
      <div><b class="tnum">${c.hand}</b><span>Hands</span></div>
      <div><b class="tnum">${c.foot}</b><span>Feet</span></div>
      <div><b class="tnum">${c.finish}</b><span>Finish</span></div>
    </div>
    ${p.length?`<p class="warn">${p.join("<br>")}</p>`:""}
    <div class="acts"><button class="btn go" id="saveB"${p.length?" disabled":""}>Save route</button>
      <button class="btn" id="cancB">Cancel</button></div>
    <div class="acts"><button class="btn" id="clrB">Clear holds</button></div>`;
  const b=(id,k)=>{const e=document.getElementById(id);e.oninput=()=>{d[k]=e.value;
    if(k==="name"){const s=document.getElementById("saveB");s.disabled=problems(d).length>0}}};
  b("fN","name"); b("fS","setter"); b("fD","desc");
  document.getElementById("fG").onchange=e=>{d.grade=e.target.value};
  document.getElementById("fA").oninput=e=>{d.angle=+e.target.value||0;paint()};
  document.getElementById("saveB").onclick=commit;
  document.getElementById("cancB").onclick=()=>{S.mode="view";S.draft=null;paint();renderSide()};
  document.getElementById("clrB").onclick=()=>{d.holds={};paint();renderSide()};
}
const NBANDS=Math.ceil(BOARD.rows/BAND);
function bandRows(i){ const lo=i*BAND; return [lo, Math.min(lo+BAND, BOARD.rows)-1] }
function checkedCount(){
  return HOLDS.filter(h=>h.v||S.bands[Math.floor(h.r/BAND)]).length;
}
function fixes(){
  const d={}; HOLDS.forEach(h=>{ if(S.on[key(h)]!==h.on) d[key(h)]=S.on[key(h)] });
  return d;
}
function renderCal(){
  document.getElementById("sidet").textContent="Calibrate";
  const f=fixes(), nf=Object.keys(f).length;
  const [r0,r1]=bandRows(S.band);
  const inBand=HOLDS.filter(h=>h.r>=r0&&h.r<=r1);
  const nHold=inBand.filter(h=>S.on[key(h)]).length;
  const chk=checkedCount(), allDone=HOLDS.every(h=>h.v);
  sideEl.innerHTML=`
    <p class="note">${allDone
      ? "You have swept the whole board and every position is confirmed. Use this to fix anything you spot later."
      : "This walks the board "+BAND+" rows at a time so you can actually see the holds."}</p>
    <div class="stat">
      <div><b class="tnum">${S.band+1}/${NBANDS}</b><span>Band</span></div>
      <div><b class="tnum">${chk}</b><span>Checked</span></div>
      <div><b class="tnum">${nf}</b><span>New fixes</span></div>
    </div>
    <p class="note" style="margin-top:12px"><b>Rows ${r0+1}&#8211;${r1+1}</b> are lit up:
      I reckon ${nHold} of those ${inBand.length} positions have holds.
      <b style="color:var(--yes)">Cyan + centre dot</b> = hold,
      <b style="color:var(--no)">red-orange dashed</b> = bare. Tap what I got wrong.</p>
    <div class="acts">
      <button class="btn" id="prevB"${S.band?"":" disabled"}>Back</button>
      <button class="btn go" id="nextB">${S.band<NBANDS-1?"Next rows":"Finish"}</button></div>
    <div class="acts"><button class="btn go" id="copyB"${nf?"":" disabled"}>Copy corrections</button></div>
    <div class="acts"><button class="btn" id="doneB">Close</button>
      <button class="btn" id="resetB"${nf?"":" disabled"}>Reset fixes</button></div>
    <p class="note" style="margin-top:12px;font-size:12.5px">Stop whenever &#8212; your place
      and your taps are saved. Paste what you copy back into our chat and I will bake it in.</p>`;
  document.getElementById("prevB").onclick=()=>{ if(S.band>0){S.band--;paint();renderCal()} };
  document.getElementById("nextB").onclick=()=>{
    S.bands[S.band]=true; save(K_BANDS,S.bands);
    if(S.band<NBANDS-1){ S.band++; paint(); renderCal() }
    else { toast("That is the whole board - hit Copy corrections"); renderCal() }
  };
  document.getElementById("doneB").onclick=()=>{S.mode="view";
    document.getElementById("calBtn").classList.remove("on");paint();renderSide()};
  document.getElementById("resetB").onclick=()=>{
    if(!confirm("Discard the corrections you have made since the last paste?"))return;
    HOLDS.forEach(h=>S.on[key(h)]=h.on); saveHolds(); paint(); renderCal(); toast("Reset")};
  const cb=document.getElementById("copyB");
  if(cb) cb.onclick=()=>{
    const txt="BOARD CORRECTIONS "+JSON.stringify(f);
    if(navigator.clipboard) navigator.clipboard.writeText(txt)
      .then(()=>toast("Copied "+nf+" correction"+(nf==1?"":"s")),()=>prompt("Copy this:",txt));
    else prompt("Copy this and paste it to Claude:",txt);
  };
}
function edit(existing,src){
  S.mode="set";
  S.draft = existing
    ? {...existing, holds:{...existing.holds}, editing:true}
    : {id:"r"+Date.now().toString(36), name:src?src.name+" copy":"", grade:src?src.grade:"",
       setter:src?src.setter:"", desc:"", angle:src?(src.angle||BOARD.angle):BOARD.angle,
       holds:src?{...src.holds}:{}, editing:false};
  paint(); renderSide(); showPane("side");
}
function commit(){
  const d=S.draft; if(problems(d).length) return;
  const r={id:d.id,name:d.name.trim(),grade:d.grade,setter:d.setter.trim(),
           desc:(d.desc||"").trim(),angle:d.angle,holds:d.holds,starter:false};
  const i=S.routes.findIndex(x=>x.id===r.id);
  if(i>=0) S.routes[i]=r; else S.routes.unshift(r);
  S.mode="view"; S.draft=null; S.sel=r;
  saveRoutes(); grades(); render(); paint(); renderSide(); toast(i>=0?"Updated":"Saved");
}

/* ---------- share ---------- */
function share(r){
  const p={n:r.name,g:r.grade,s:r.setter,d:r.desc,a:r.angle,h:r.holds};
  const u=location.origin+location.pathname+"#r="+b64(JSON.stringify(p));
  if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>toast("Link copied"),()=>toast("Couldn't copy \u2014 select the URL bar"));
  else toast("Copy the address bar");
}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const ub64=s=>decodeURIComponent(escape(atob(s)));
function fromHash(){
  const m=location.hash.match(/^#r=(.+)$/); if(!m) return null;
  try{ const p=JSON.parse(ub64(m[1]));
    return {id:"shared"+Date.now().toString(36),name:p.n||"Shared route",grade:p.g||"",
            setter:p.s||"",desc:p.d||"",angle:p.a||BOARD.angle,holds:p.h||{},starter:false};
  }catch(e){ return null }
}

/* ---------- misc ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
let tt; function toast(m){const t=document.getElementById("toast");t.textContent=m;
  t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
function grades(){
  const s=document.getElementById("gf"), keep=s.value;
  const used=[...new Set(S.routes.map(r=>r.grade).filter(Boolean))]
    .sort((a,b)=>GRADES.indexOf(a)-GRADES.indexOf(b));
  s.innerHTML='<option value="">All grades</option>'
    +(S.routes.some(r=>!r.grade)?'<option value="~">Ungraded</option>':"")
    +used.map(g=>`<option>${g}</option>`).join("");
  s.value=keep;
}
function showPane(which){
  if(innerWidth>1040) return;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.pane===which));
  document.getElementById("pane-routes").classList.toggle("show",which==="routes");
  document.getElementById("pane-side").classList.toggle("show",which==="side");
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showPane(b.dataset.pane));

/* ---------- boot ---------- */
document.getElementById("bname").textContent=BOARD.name;
document.getElementById("bsub").textContent=`${BOARD.cols}\u00d7${BOARD.rows} grid \u00b7 ${BOARD.angle}\u00b0`;
document.getElementById("newBtn").onclick=()=>edit(null,null);
const mixEl=document.getElementById("mix");
function setMix(v){ stage.style.setProperty("--mix", v/100); }
mixEl.oninput=()=>{ setMix(+mixEl.value); save(K_VIEW, +mixEl.value); };
document.getElementById("calBtn").onclick=()=>{
  if(S.mode==="cal"){S.mode="view"}else{S.mode="cal";S.draft=null}
  document.getElementById("calBtn").classList.toggle("on",S.mode==="cal");
  paint(); renderSide(); showPane("side");
};
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const nx = dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx); save(K_THEME,nx);
};
document.getElementById("q").oninput=render;
document.getElementById("gf").onchange=render;

const th=load(K_THEME,null); if(th) document.documentElement.setAttribute("data-theme",th);
mixEl.value=load(K_VIEW,100); setMix(+mixEl.value);
S.bands=load(K_BANDS,{});
S.band=(()=>{for(let i=0;i<NBANDS;i++) if(!S.bands[i]) return i; return 0})();
const savedFix=load(K_HOLDS,{}); for(const k in savedFix) if(k in S.on) S.on[k]=savedFix[k];
S.routes=[...load(K_ROUTES,[]),...STARTER];
const sh=fromHash(); if(sh){ S.routes.unshift(sh); S.sel=sh } else S.sel=S.routes[0]||null;
buildBoard(); grades(); render(); renderSide();
addEventListener("resize",()=>{ if(innerWidth>1040){
  document.getElementById("pane-routes").classList.add("show");
  document.getElementById("pane-side").classList.add("show"); } });
</script>
