<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notion Pet</title>
  <style>
    :root{
      --pet-size: 120;         /* in px (number only) */
      --speed: 1950;           /* px per second */
      --bg: transparent;      /* background behind the pet */
      --ui-bg: rgba(255,255,255,0.85);
      --ui-fg: #111;
      --ui-border: rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --ui-bg: rgba(17,17,17,0.75);
        --ui-fg: #f2f2f2;
        --ui-border: rgba(255,255,255,0.12);
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      touch-action: manipulation;
      user-select: none;
    }
    #pet {
      position: absolute;
      width: calc(var(--pet-size) * 1px);
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: filter 0.2s ease;
      will-change: transform;
      pointer-events: none; /* clicks pass through to page */
    }
    
    .moving 
    
      to   { transform: translate(-50%, -50%) scale(0.95, 1.05); }
    }

    /* Tiny HUD for quick tuning (optional) */
    
    
    
    
    
    

    /* SVG bits */
    .pupil { transition: transform 120ms ease; transform-box: fill-box; transform-origin: center; }
    .tail  { transform-box: fill-box; transform-origin: 20px 64px; }
    .moving .tail { animation: wag 0.28s ease-in-out infinite alternate; }
    @keyframes wag {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(8deg); }
    }
    .blink { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink {
      0%, 2%, 100% { transform: scaleY(1); }
      1%          { transform: scaleY(0.05); }
    }
    /* Reduce motion if user prefers */
    @media (prefers-reduced-motion: reduce){
      .moving #shadow, .moving .tail { animation: none; }
      .blink { animation: none; }
    }
  </style>
</head>

  <script>
    // Optional: ?bg=%23ffffff to set background
(function applyQueryParams(){
  const params = new URLSearchParams(location.search);
  const bg = params.get("bg");
  if(bg) document.documentElement.style.setProperty("--bg", decodeURIComponent(bg));
})();

    const pet    = document.getElementById("pet");
    const shadow = document.getElementById("shadow");
            
    let pos    = { x: innerWidth/2, y: innerHeight/2 };
    let target = { x: innerWidth/2, y: innerHeight/2 };
    let lastT  = performance.now();
    let idleTimer = null;
    let isMoving = false;

    // Place pet initially
    setPos(pos.x, pos.y);
    setMoving(false);

    // Click / tap to move
    addEventListener("pointerdown", (e) => {
      const { x, y } = clampToStage(e.clientX, e.clientY);
      target.x = x; target.y = y;
      pokeEyesToward(x, y);
      resetIdle();
    });

    // Idle wander every ~6–10s
    function startIdle(){
      idleTimer = setTimeout(() => {
        const x = randBetween(20, innerWidth - 20);
        const y = randBetween(20, innerHeight - 20);
        const {x:cx, y:cy} = clampToStage(x, y);
        target.x = cx; target.y = cy;
        startIdle(); // schedule next
      }, randBetween(6000, 10000));
    }
    function resetIdle(){
      clearTimeout(idleTimer);
      startIdle();
    }
    startIdle();

    // Main loop
    function tick(now){
      const dt = Math.min(0.040, (now - lastT) / 1000); // cap dt for stability
      lastT = now;

      const speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 300;
      const dx = target.x - pos.x;
      const dy = target.y - pos.y;
      const dist = Math.hypot(dx, dy);

      if(dist > 1){
        const vx = (dx / dist) * speed;
        const vy = (dy / dist) * speed;
        pos.x += vx * dt;
        pos.y += vy * dt;
        // Face direction
        const dir = Math.sign(vx) || 1;
        pet.style.transform = "translate(-50%, -50%)";
        setMoving(true);
      } else {
        setMoving(false);
      }

      setPos(pos.x, pos.y);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Keep pet within the frame
    addEventListener("resize", () => clampPosition(true));
    function clampPosition(updateTarget=false){
      const clamped = clampToStage(pos.x, pos.y);
      pos.x = clamped.x;
      pos.y = clamped.y;
      setPos(pos.x, pos.y);
      if(updateTarget){
        const t = clampToStage(target.x, target.y);
        target.x = t.x; target.y = t.y;
      }
    }

    function clampToStage(x, y){
      const rect = pet.getBoundingClientRect();
      const halfW = rect.width/2;
      const halfH = rect.height/2;
      const margin = 6;
      const minX = margin + halfW;
      const maxX = innerWidth - margin - halfW;
      const minY = margin + halfH;
      const maxY = innerHeight - margin - halfH;
      return {
        x: Math.max(minX, Math.min(maxX, x)),
        y: Math.max(minY, Math.min(maxY, y))
      };
    }

    function setPos(x, y){
      pet.style.left = x + "px";
      pet.style.top  = y + "px";
      }

    function setMoving(m){
      if(m === isMoving) return;
      isMoving = m;
      document.body.classList.toggle("moving", m);
      pet.style.filter = m ? "saturate(1.05)" : "none";
    }

    function randBetween(min, max){ return Math.random() * (max - min) + min; }

    // Make the pupils look toward the target slightly
    const eyeL = document.getElementById("eyeL");
    const eyeR = document.getElementById("eyeR");
    function pokeEyesToward(tx, ty){
      const rect = pet.getBoundingClientRect();
      const center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
      const angle = Math.atan2(ty - center.y, tx - center.x);
      const offset = 2.2; // px
      const ox = Math.cos(angle) * offset;
      const oy = Math.sin(angle) * offset;
      eyeL.style.transform = `translate(${ox}px, ${oy}px)`;
      eyeR.style.transform = `translate(${ox}px, ${oy}px)`;
      // relax back a bit after a moment
      setTimeout(() => {
        eyeL.style.transform = "translate(0,0)";
        eyeR.style.transform = "translate(0,0)";
      }, 400);
    }

    addEventListener("keydown", (e) => {
  if(e.key === "c"){
    target.x = innerWidth/2;
    target.y = innerHeight/2;
  }
});
</script>
